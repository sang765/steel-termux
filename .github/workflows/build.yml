name: Build Steel CLI for Termux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      steel_version:
        description: 'Steel CLI version to build (e.g., v0.4.4)'
        required: false
        default: 'latest'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Steel version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.steel_version }}" != "latest" ]; then
            echo "version=${{ github.event.inputs.steel_version }}" >> $GITHUB_OUTPUT
          else
            # Get latest release tag from steel-dev/cli
            VERSION=$(curl -s https://api.github.com/repos/steel-dev/cli/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Steel CLI
        uses: actions/checkout@v4
        with:
          repository: steel-dev/cli
          ref: ${{ steps.version.outputs.version }}
          path: steel-cli

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android NDK and add Rust target
        run: |
          NDK_VERSION="r26b"
          NDK_URL="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          echo "Downloading Android NDK ${NDK_VERSION}..."
          curl -fsSL "$NDK_URL" -o /tmp/ndk.zip
          echo "Extracting NDK..."
          unzip -q /tmp/ndk.zip -d /opt
          echo "NDK_HOME=/opt/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
          rm /tmp/ndk.zip
          
          echo "Adding Rust target..."
          rustup target add aarch64-linux-android
          rustup show

      - name: Build for Termux (aarch64-android)
        working-directory: steel-cli
        run: |
          rm -f rust-toolchain.toml
          
          export CC_aarch64_linux_android=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang
          export AR_aarch64_linux_android=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang
          
          cargo fetch --target aarch64-linux-android
          
          # Patch agent-browser: build_playwright_binary_path is missing a catch-all fallback.
          # build_puppeteer_binary_path already has one. Android falls through to nothing.
          echo "Patching agent-browser for Android compatibility..."
          CHROME_RS=$(find ~/.cargo/git/checkouts -path "*/agent-browser*/cli/src/native/cdp/chrome.rs" -type f | head -1)
          if [ -n "$CHROME_RS" ]; then
            echo "Found chrome.rs: $CHROME_RS"
            if ! grep -q 'cfg(not(any(target_os = "macos", target_os = "linux", target_os = "windows")))' "$CHROME_RS" | grep -q 'build_playwright_binary_path'; then
              echo '#[cfg(not(any(target_os = "macos", target_os = "linux", target_os = "windows")))]' >> "$CHROME_RS"
              echo 'fn build_playwright_binary_path(chromium_dir: &Path) -> PathBuf {' >> "$CHROME_RS"
              echo '    chromium_dir.join("chrome-linux64/chrome")' >> "$CHROME_RS"
              echo '}' >> "$CHROME_RS"
              echo "Fallback added."
            else
              echo "Fallback already exists, skipping."
            fi
          else
            echo "Warning: chrome.rs not found"
          fi
          
          rustup target list --installed
          cargo build --release --target aarch64-linux-android --frozen

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          cp steel-cli/target/aarch64-linux-android/release/steel release/
          chmod +x release/steel
          
          # Create tarball
          cd release
          tar czf ../steel-${{ steps.version.outputs.version }}-aarch64-termux.tar.gz steel
          cd ..
          
          # Create checksum
          sha256sum steel-${{ steps.version.outputs.version }}-aarch64-termux.tar.gz > steel-${{ steps.version.outputs.version }}-aarch64-termux.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: steel-termux
          path: |
            steel-${{ steps.version.outputs.version }}-aarch64-termux.tar.gz
            steel-${{ steps.version.outputs.version }}-aarch64-termux.tar.gz.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            steel-${{ steps.version.outputs.version }}-aarch64-termux.tar.gz
            steel-${{ steps.version.outputs.version }}-aarch64-termux.tar.gz.sha256
          generate_release_notes: true
